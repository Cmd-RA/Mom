<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>राजा भाई - सुरक्षित कंट्रोल पैनल</title>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #e0e0e0; text-align: center; padding: 20px; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 20px; max-width: 450px; margin: auto; border: 2px solid #0088cc; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 15px; margin: 15px 0; border-radius: 10px; border: 1px solid #333; background: #252525; color: white; font-size: 16px; }
        button { width: 95%; padding: 15px; background: #0088cc; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.3s; }
        button:hover { background: #00aaff; transform: scale(1.02); }
        .status { margin-top: 20px; color: #00ffcc; font-size: 16px; font-weight: bold; }
        .label { text-align: left; margin-left: 5%; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <h2 style="color: #0088cc;">राजा भाई डिजिटल मास्टर हब</h2>
    
    <div class="box">
        <div class="label">आपकी गुप्त चाबी (Token):</div>
        <input type="password" id="botToken" value="8718819406:AAGv0Q3aVNIVC-CHzwfkGs2Ruv3fkCqJhGU">
        
        <div class="label">चैनल का पता (User Name):</div>
        <input type="text" id="channelId" value="@rajakumar18ni">

        <div class="label">वीडियो फाइल चुनें:</div>
        <input type="file" id="videoFile" accept="video/*">
        
        <button onclick="sendVideo()">🚀 चैनल पर अपलोड करें</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        async function sendVideo() {
            const token = document.getElementById('botToken').value;
            const chatId = document.getElementById('channelId').value;
            const fileInput = document.getElementById('videoFile');
            const status = document.getElementById('status');

            if(!token || !chatId) { alert("राजा भाई, चाबी और चैनल दोनों ज़रूरी हैं!"); return; }
            if(fileInput.files.length === 0) { alert("कृपया अपलोड करने के लिए एक वीडियो चुनें!"); return; }

            status.innerText = "⏳ वीडियो उड़ान भर रहा है... कृपया रुकें।";

            const formData = new FormData();
            formData.append("video", fileInput.files[0]);
            formData.append("chat_id", chatId);
            formData.append("caption", "राजा भाई के बोट द्वारा ऑटो-अपलोड ✅");

            try {
                const response = await fetch(`https://api.telegram.org/bot${token}/sendVideo`, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                if(result.ok) {
                    status.innerText = "✅ बधाई हो राजा भाई! वीडियो चैनल पर पहुँच गया।";
                } else {
                    status.innerText = "❌ गड़बड़: " + result.description;
                }
            } catch (error) {
                status.innerText = "❌ नेटवर्क एरर! अपना इंटरनेट चेक करें।";
            }
        }
    </script>

</body>
</html>
