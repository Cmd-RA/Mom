<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>राजा भाई डिजिटल यूट्यूब</title>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #fff; text-align: center; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: #181818; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        input, textarea { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #212121; color: white; }
        textarea { height: 80px; }
        .btn { width: 95%; padding: 15px; background: #f00; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-blue { background: #0088cc; margin-top: 10px; }
        .status { margin-top: 15px; color: #00ffcc; font-size: 14px; }
        #videoPreview { width: 100%; border-radius: 10px; margin-top: 20px; display: none; border: 1px solid #444; }
        .label { text-align: left; margin-left: 5%; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <h2>Raja Kumar <span style="color:red;">Studio</span></h2>
    
    <div class="container">
        <input type="hidden" id="botToken" value="8718819406:AAGv0Q3aVNIVC-CHzwfkGs2Ruv3fkCqJhGU">
        <input type="hidden" id="channelId" value="@rajakumar18ni">

        <div class="label">मैसेज, लिंक या नंबर लिखें:</div>
        <textarea id="messageText" placeholder="यहाँ कुछ भी लिखें..."></textarea>

        <div class="label">वीडियो चुनें:</div>
        <input type="file" id="videoFile" accept="video/*" onchange="previewLocalVideo()">
        
        <video id="videoPreview" controls></video>

        <button class="btn" onclick="sendToChannel()">🚀 चैनल पर पब्लिश करें</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // लोकल वीडियो प्रीव्यू दिखाने के लिए
        function previewLocalVideo() {
            const file = document.getElementById('videoFile').files[0];
            const video = document.getElementById('videoPreview');
            if (file) {
                video.src = URL.createObjectURL(file);
                video.style.display = "block";
            }
        }

        async function sendToChannel() {
            const token = document.getElementById('botToken').value;
            const chatId = document.getElementById('channelId').value;
            const message = document.getElementById('messageText').value;
            const fileInput = document.getElementById('videoFile');
            const status = document.getElementById('status');

            if (!message && fileInput.files.length === 0) {
                alert("राजा भाई, कुछ तो लिखिए या वीडियो चुनिए!");
                return;
            }

            status.innerText = "⏳ अपलोड शुरू... इसमें थोड़ा समय लग सकता है।";

            let formData = new FormData();
            formData.append("chat_id", chatId);
            
            let apiMethod = "sendMessage";
            if (fileInput.files.length > 0) {
                apiMethod = "sendVideo";
                formData.append("video", fileInput.files[0]);
                formData.append("caption", message);
            } else {
                formData.append("text", message);
            }

            try {
                const response = await fetch(`https://api.telegram.org/bot${token}/${apiMethod}`, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                if (result.ok) {
                    status.innerText = "✅ सफलता! चैनल पर पब्लिश हो गया।";
                    alert("राजा भाई, वीडियो सफलतापूर्वक चैनल पर चला गया!");
                } else {
                    status.innerText = "❌ एरर: " + result.description;
                }
            } catch (error) {
                status.innerText = "❌ नेटवर्क की समस्या! इंटरनेट चेक करें।";
            }
        }
    </script>
</body>
</html>
